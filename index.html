<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applesoft BASIC Interpreter</title>
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

<div id="apple2-frame" data-bg="img/AppleIIBG01.png">
  <img id="bg-image" src="img/AppleIIBG01.png" alt="Apple II">
  <div id="screen-container">
    <div id="screen">
      <canvas id="lores-canvas" width="280" height="192"></canvas>
      <div id="text-display"></div>
    </div>
  </div>
  <div id="power-btn" title="Power On/Off">
    <div id="power-led"></div>
  </div>
  <div id="drive1-led" class="drive-led"></div>
  <div id="drive2-led" class="drive-led"></div>
</div>

<input type="file" id="file-upload" accept=".bas,.txt,.BAS,.TXT" multiple>

<!-- Inline screen positioning with debug output -->
<script>
(function() {
  // CRT glass coordinates in source image (1536x1024)
  // Measured from AppleIIBG01.png glass boundaries
  var GL = 407, GT = 97, GW = 430, GH = 375, IW = 1536, IH = 1024;
  // Drive LED positions in source image pixels (1536x1024)
  var D1X = 1090, D1Y = 685, D2X = 1090, D2Y = 868, DLS = 10;
  function pos() {
    var img = document.getElementById('bg-image');
    var fr  = document.getElementById('apple2-frame');
    var sc  = document.getElementById('screen-container');
    var d1  = document.getElementById('drive1-led');
    var d2  = document.getElementById('drive2-led');
    if (!img || !fr || !sc) return;
    var ir = img.getBoundingClientRect();
    if (!ir.width || !ir.height) return;  // image not laid out yet
    var ff = fr.getBoundingClientRect();
    var ox = ir.left - ff.left, oy = ir.top - ff.top;
    var sx = ir.width / IW, sy = ir.height / IH;
    var l = ox + GL * sx, t = oy + GT * sy;
    var w = GW * sx, h = GH * sy;
    sc.style.left   = l + 'px';
    sc.style.top    = t + 'px';
    sc.style.width  = w + 'px';
    sc.style.height = h + 'px';
    // Position drive LEDs
    var ds = DLS * sx;
    if (d1) { d1.style.left = (ox + D1X * sx) + 'px'; d1.style.top = (oy + D1Y * sy) + 'px'; d1.style.width = ds + 'px'; d1.style.height = ds + 'px'; }
    if (d2) { d2.style.left = (ox + D2X * sx) + 'px'; d2.style.top = (oy + D2Y * sy) + 'px'; d2.style.width = ds + 'px'; d2.style.height = ds + 'px'; }
    document.title = 'Applesoft BASIC Interpreter';
  }
  // Ensure pos() runs after the background image is fully loaded & rendered
  function initPos() {
    var img = document.getElementById('bg-image');
    if (img && img.complete && img.naturalWidth) { pos(); }
    else if (img) { img.addEventListener('load', pos); }
    // Fallback: poll a few times in case load event was missed
    var tries = 0;
    var poll = setInterval(function() {
      pos();
      if (++tries >= 10) clearInterval(poll);
    }, 200);
  }
  window.addEventListener('load', initPos);
  window.addEventListener('resize', pos);
  window.positionScreen = pos;
})();
</script>

<!-- Scripts loaded in dependency order (no ES modules for file:// compatibility) -->
<script src="js/constants.js?v=3"></script>
<script src="js/audio.js?v=3"></script>
<script src="js/tokenizer.js?v=3"></script>
<script src="js/parser.js?v=3"></script>
<script src="js/filesystem.js?v=3"></script>
<script src="js/samples.js?v=3"></script>
<script src="js/tutorial.js?v=3"></script>
<script src="js/display.js?v=3"></script>
<script src="js/claude.js?v=3"></script>
<script src="js/interpreter.js?v=3"></script>
<script src="js/emulator.js?v=3"></script>
<script src="js/main.js?v=3"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applesoft BASIC Interpreter</title>
<link rel="stylesheet" href="css/style.css?v=15">
</head>
<body>

<div id="apple2-frame" data-bg="img/AppleIIBG01.png">
  <img id="bg-image" src="img/AppleIIBG01.png" alt="Apple II">
  <div id="screen-container">
    <div id="screen">
      <canvas id="apple2-canvas" width="280" height="192"></canvas>
    </div>
  </div>
  <div id="power-btn" title="Power On/Off">
    <div id="power-led"></div>
  </div>
  <div id="drive1-led" class="drive-led"></div>
  <div id="drive2-led" class="drive-led"></div>
</div>

<!-- Screen position controls (dev tool) — fixed overlay -->
<div id="pos-controls">
  <span id="pos-display">X:384 Y:102 W:466 H:364</span>
  <button data-axis="x" data-dir="-1">X-</button>
  <button data-axis="x" data-dir="1">X+</button>
  <button data-axis="y" data-dir="-1">Y-</button>
  <button data-axis="y" data-dir="1">Y+</button>
  <button data-axis="w" data-dir="-1">W-</button>
  <button data-axis="w" data-dir="1">W+</button>
  <button data-axis="h" data-dir="-1">H-</button>
  <button data-axis="h" data-dir="1">H+</button>
  <label><input type="number" id="pos-step" value="1" min="1" max="50" style="width:40px"> step</label>
  <span style="color:#666;margin:0 2px">|</span>
  <button id="scale-down">%-</button>
  <span id="scale-display" style="color:#ff0;font:bold 11px monospace">97%</span>
  <button id="scale-up">%+</button>
</div>

<input type="file" id="file-upload" accept=".bas,.txt,.BAS,.TXT" multiple>

<!-- Inline screen positioning with debug output -->
<script>
(function() {
  // CRT glass coordinates in source image (1536x1024)
  // Measured from AppleIIBG01.png glass boundaries
  var GL = 384, GT = 102, GW = 466, GH = 364, IW = 1536, IH = 1024;
  // Drive LED positions as percentage of image (left%, top%)
  var D1LP = 74.5, D1TP = 59.5, D2LP = 74.5, D2TP = 77.5, DLS = 10;
  function pos() {
    var img = document.getElementById('bg-image');
    var fr  = document.getElementById('apple2-frame');
    var sc  = document.getElementById('screen-container');
    var d1  = document.getElementById('drive1-led');
    var d2  = document.getElementById('drive2-led');
    if (!img || !fr || !sc) return;
    var ir = img.getBoundingClientRect();
    if (!ir.width || !ir.height) return;
    var ff = fr.getBoundingClientRect();
    var ox = ir.left - ff.left, oy = ir.top - ff.top;
    var sx = ir.width / IW, sy = ir.height / IH;
    var l = ox + GL * sx, t = oy + GT * sy;
    var w = GW * sx, h = GH * sy;
    sc.style.left   = l + 'px';
    sc.style.top    = t + 'px';
    sc.style.width  = w + 'px';
    sc.style.height = h + 'px';
    // Position drive LEDs
    var ds = DLS * sx;
    if (d1) { d1.style.left = D1LP + '%'; d1.style.top = D1TP + '%'; d1.style.width = ds + 'px'; d1.style.height = ds + 'px'; }
    if (d2) { d2.style.left = D2LP + '%'; d2.style.top = D2TP + '%'; d2.style.width = ds + 'px'; d2.style.height = ds + 'px'; }
    // Update display
    var disp = document.getElementById('pos-display');
    if (disp) disp.textContent = 'X:' + GL + ' Y:' + GT + ' W:' + GW + ' H:' + GH;
    document.title = 'Applesoft BASIC Interpreter';
  }

  // Base values for percentage scaling
  var baseGW = GW, baseGH = GH, scalePct = 97;
  function updateScale(delta) {
    scalePct = Math.max(50, Math.min(150, scalePct + delta));
    GW = Math.round(baseGW * scalePct / 100);
    GH = Math.round(baseGH * scalePct / 100);
    var sd = document.getElementById('scale-display');
    if (sd) sd.textContent = scalePct + '%';
    pos();
  }

  // Button handlers
  document.addEventListener('click', function(e) {
    var btn = e.target;
    if (btn.id === 'scale-down') { updateScale(-1); return; }
    if (btn.id === 'scale-up')   { updateScale(1);  return; }
    if (btn.tagName !== 'BUTTON' || !btn.dataset.axis) return;
    var step = parseInt(document.getElementById('pos-step').value) || 1;
    var dir = parseInt(btn.dataset.dir);
    switch (btn.dataset.axis) {
      case 'x': GL += step * dir; break;
      case 'y': GT += step * dir; break;
      case 'w': GW += step * dir; baseGW = GW; break;
      case 'h': GH += step * dir; baseGH = GH; break;
    }
    pos();
  });
  // Ensure pos() runs after the background image is fully loaded & rendered
  function initPos() {
    var img = document.getElementById('bg-image');
    if (img && img.complete && img.naturalWidth) { pos(); }
    else if (img) { img.addEventListener('load', pos); }
    // Fallback: poll a few times in case load event was missed
    var tries = 0;
    var poll = setInterval(function() {
      pos();
      if (++tries >= 10) clearInterval(poll);
    }, 200);
  }
  window.addEventListener('load', initPos);
  window.addEventListener('resize', pos);
  window.positionScreen = pos;
})();
</script>

<!-- Scripts loaded in dependency order (no ES modules for file:// compatibility) -->
<script src="js/constants.js?v=15"></script>
<script src="js/audio.js?v=15"></script>
<script src="js/tokenizer.js?v=15"></script>
<script src="js/parser.js?v=15"></script>
<script src="js/filesystem.js?v=15"></script>
<script src="js/samples.js?v=15"></script>
<script src="js/tutorial.js?v=15"></script>
<script src="js/display.js?v=15"></script>
<script src="js/claude.js?v=15"></script>
<script src="js/interpreter.js?v=15"></script>
<script src="js/emulator.js?v=15"></script>
<script src="js/main.js?v=15"></script>

</body>
</html>
